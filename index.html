<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verongg AI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Cerebro de Verongg -->
    <script src="https://js.puter.com/v2/"></script>
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">Verongg</div>
            <div class="status">● En línea</div>
        </header>

        <main class="chat" id="chat">

            <div class="message ai">
                <div class="name">Verongg</div>

                <div class="text">
                    Hola 👋 Soy Verongg. Mi cerebro está listo. ¿En qué puedo ayudarte?
                </div>
            </div>

        </main>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >

            <button id="sendButton">
                Enviar
            </button>

        </div>

    </div>

    <script>

        const chat = document.getElementById("chat");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");

        /*
        ==========================================
        CEREBRO DE VERONGG
        ==========================================
        */

        const conversation = [

            {
                role: "system",

                content: `
Eres Verongg, una inteligencia artificial avanzada.

Tu nombre es Verongg.

PERSONALIDAD:
- Eres inteligente.
- Eres amable.
- Eres natural al conversar.
- Eres paciente.
- Explicas las cosas de manera clara.
- No inventas información cuando no la sabes.
- Adaptas tus respuestas al usuario.
- Mantienes el contexto de la conversación.

CAPACIDADES:
- Ayudas con programación.
- Puedes escribir y explicar código.
- Ayudas con matemáticas.
- Ayudas con ciencias.
- Ayudas a estudiar.
- Ayudas a escribir textos.
- Puedes analizar problemas.
- Puedes explicar conceptos difíciles de manera sencilla.
- Puedes generar ideas.
- Puedes ayudar a planificar proyectos.

PROGRAMACIÓN:
Cuando el usuario pida código:
- Intenta proporcionar código funcional.
- Usa el lenguaje apropiado.
- Explica brevemente qué hace.
- Si hay un error en el código del usuario, intenta localizarlo y corregirlo.

RESPUESTAS:
- Responde en español si el usuario habla español.
- Si el usuario cambia de idioma, puedes responder en ese idioma.
- No repitas innecesariamente la pregunta.
- No digas que eres ChatGPT.
- Tu nombre es Verongg.
- No afirmes que puedes hacer algo si realmente no puedes hacerlo.

Tu objetivo es ser un asistente útil, inteligente y claro.
`
            }

        ];

        /*
        ==========================================
        MOSTRAR MENSAJES
        ==========================================
        */

        function addMessage(name, text, type) {

            const message = document.createElement("div");

            message.className = `message ${type}`;

            const nameElement = document.createElement("div");

            nameElement.className = "name";

            nameElement.textContent = name;

            const textElement = document.createElement("div");

            textElement.className = "text";

            textElement.textContent = text;

            message.appendChild(nameElement);
            message.appendChild(textElement);

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;

            return textElement;
        }

        /*
        ==========================================
        CEREBRO
        ==========================================
        */

        async function askVerongg(message) {

            conversation.push({

                role: "user",

                content: message

            });

            const response = await puter.ai.chat(

                conversation,

                {

                    model: "gpt-5.6-luna",

                    temperature: 0.7,

                    max_tokens: 2000

                }

            );

            let answer = "";

            if (response && response.message) {

                answer = response.message.content;

            } else if (typeof response === "string") {

                answer = response;

            } else {

                answer = "No pude generar una respuesta.";

            }

            conversation.push({

                role: "assistant",

                content: answer

            });

            return answer;
        }

        /*
        ==========================================
        ENVIAR MENSAJE
        ==========================================
        */

        async function sendMessage() {

            const message = userInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(
                "Tú",
                message,
                "user"
            );

            userInput.value = "";

            sendButton.disabled = true;

            userInput.disabled = true;

            const responseElement = addMessage(
                "Verongg",
                "🧠 Pensando...",
                "ai"
            );

            try {

                const answer = await askVerongg(message);

                responseElement.textContent = answer;

            }

            catch (error) {

                console.error(
                    "Error del cerebro:",
                    error
                );

                responseElement.textContent =
                    "⚠️ No pude conectarme con mi cerebro. Inténtalo nuevamente.";

            }

            sendButton.disabled = false;

            userInput.disabled = false;

            userInput.focus();

        }

        /*
        ==========================================
        BOTÓN
        ==========================================
        */

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        /*
        ==========================================
        ENTER
        ==========================================
        */

        userInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>
</html>
