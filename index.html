<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verongg AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">Verongg</div>
            <div class="status">● En línea</div>
        </header>

        <main class="chat" id="chat">
            <div class="message ai">
                <div class="name">Verongg</div>
                <div class="text">
                    Hola 👋 Soy Verongg. Estoy listo para ayudarte.
                </div>
            </div>
        </main>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >

            <button id="sendButton">
                Enviar
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
